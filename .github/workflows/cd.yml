name: CD

# Pipeline unico: test → build → release.
#
# Push a `main` (o disparo manual): corre los gates, construye el zip de owlcms con
# el tema `modern` adentro, verifica que el tema realmente haya entrado, y reemplaza
# el release rodante `modern-latest`.
#
# Rodante quiere decir que SIEMPRE hay exactamente un release y siempre tiene el
# ultimo build de `main`. Es el mismo criterio que el entorno de staging en los otros
# repos: corre lo ultimo que se pusheo, sin historial. La ventaja practica es que el
# link que se le pasa a la gente nunca cambia.
#
# Se implementa borrando el release y su tag (`--cleanup-tag`) antes de recrearlo,
# porque `gh release edit` no puede mover un tag existente a otro commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grupo compartido y sin cancelacion: los releases hacen cola en vez de morir a
# mitad de camino. Dos corridas borrando y recreando el mismo tag a la vez es justo
# lo que no queremos.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  MAVEN_OPTS: '-Xmx2048m'
  # Tag y nombre del release rodante.
  TAG: modern-latest
  # Version que se le pasa a Maven. No es el tag: solo alimenta -Drevision, que
  # termina en el nombre interno del artefacto.
  BASE_REVISION: '68.0.0-beta10-modern'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  release:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      # En push a `main` esto siempre pasa, pero el disparo manual permite elegir
      # cualquier rama y ahi el tema puede no existir. Sin este chequeo, eso se
      # descubre al final del build en vez de en segundos.
      - name: Check that this branch has the modern theme
        run: |
          set -euo pipefail
          falta=0
          for tema in modern modern-public modern-video; do
            d="shared/src/main/resources/css/$tema"
            if [ -d "$d" ]; then
              echo "  $d: $(ls "$d" | wc -l | tr -d ' ') archivos"
            else
              echo "ERROR: falta $d" >&2
              falta=1
            fi
          done
          if ! grep -q 'Archivo' owlcms/src/main/resources/META-INF/resources/styles.css 2>/dev/null; then
            echo "ERROR: styles.css no trae los @font-face de Archivo." >&2
            falta=1
          fi
          if [ "$falta" -ne 0 ]; then
            echo "" >&2
            echo "La rama '$GITHUB_REF_NAME' no tiene el tema modern." >&2
            exit 1
          fi
          echo "Rama '$GITHUB_REF_NAME': el tema esta presente."

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install pinned Maven 3.8.8
        run: |
          set -euo pipefail
          MAVEN_VERSION=3.8.8
          MAVEN_DIR="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION"
          MAVEN_TGZ="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"

          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz" -o "$MAVEN_TGZ"
          rm -rf "$MAVEN_DIR"
          mkdir -p "$MAVEN_DIR"
          tar -xzf "$MAVEN_TGZ" -C "$RUNNER_TEMP"

          echo "$MAVEN_DIR/bin" >> "$GITHUB_PATH"
          echo "M2_HOME=$MAVEN_DIR" >> "$GITHUB_ENV"
          echo "MAVEN_HOME=$MAVEN_DIR" >> "$GITHUB_ENV"
          "$MAVEN_DIR/bin/mvn" -v

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml', 'shared/pom.xml', 'owlcms/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('pom.xml', 'shared/pom.xml', 'owlcms/pom.xml') }}
            ${{ runner.os }}-maven-

      # El pom declara `owlcms-maven-repo` (https://maven.jflamy.dev/releases) ANTES
      # que central, y ese repo no tiene `vaadin-dev-server`: responde 404 con un
      # cuerpo HTML. Maven lo registro como "Downloaded ... (0 B at 0 B/s)", dejo un
      # jar de 0 bytes en ~/.m2 y no cayo a central, que si lo tiene (229 kB). Despues
      # javac no pudo leer el jar y reporto "cannot access app.owlcms.*" en 40
      # archivos, tapando la causa real.
      #
      # Sembrarlo desde central hace que Maven lo resuelva del repo local y no
      # consulte los remotos. Si el upstream arregla su repo, este paso sigue
      # funcionando igual, asi que se puede dejar.
      - name: Work around empty artifacts from owlcms-maven-repo
        run: |
          set -euo pipefail
          find ~/.m2/repository -name '*.jar' -size 0 -print -delete 2>/dev/null || true
          find ~/.m2/repository -name '*.lastUpdated' -delete 2>/dev/null || true

          ART_JAR="$HOME/.m2/repository/com/vaadin/vaadin-dev-server/25.2.4/vaadin-dev-server-25.2.4.jar"
          mvn -B dependency:get \
            -Dartifact=com.vaadin:vaadin-dev-server:25.2.4 \
            -DremoteRepositories='central::::https://repo.maven.apache.org/maven2'

          # No es fatal: es solo un atajo para el artefacto que ya sabemos que viene
          # roto. Si falla, el paso de Build lo detecta y lo repara igual.
          if [ -s "$ART_JAR" ]; then
            echo "vaadin-dev-server sembrado desde central: $(wc -c < "$ART_JAR") bytes"
          else
            echo "AVISO: no se pudo sembrar vaadin-dev-server. El paso de Build lo va a reparar."
          fi

      # Build con reparacion y reintento.
      #
      # El repo de owlcms sirve artefactos rotos (ver el paso anterior) y NO es un
      # artefacto fijo: la primera vez fue `vaadin-dev-server`, la segunda
      # `jakarta.annotation-api`. Cualquier dependencia que Maven le pida a ese repo y
      # que el repo no tenga puede volver en 0 bytes, y Maven la acepta.
      #
      # Con cache tibio casi no se nota, porque Maven no vuelve a pedir lo que ya
      # tiene. Con cache frio si: y el cache de Actions esta scopeado por rama, asi que
      # el primer build de una rama nueva SIEMPRE arranca en frio aunque otra rama
      # tenga uno guardado. Por eso funciono en `modern-theme` y fallo en `main`.
      #
      # La estrategia: intentar, y si falla, buscar los jars invalidos del repo local,
      # recuperarlos de central por coordenadas y reintentar. Si el build falla sin
      # jars invalidos, el problema es otro y se corta enseguida en vez de gastar
      # reintentos.
      - name: Build
        run: |
          set -euo pipefail
          REPO_LOCAL="$HOME/.m2/repository"
          CENTRAL='central::::https://repo.maven.apache.org/maven2'

          # Un jar valido empieza con la firma ZIP "PK". Esto detecta tanto los de 0
          # bytes como los que traen un cuerpo HTML de error (el repo devuelve 404 con
          # 1792 bytes de HTML, que `-size 0` no encontraria).
          jars_invalidos() {
            find "$REPO_LOCAL" -name '*.jar' -print0 2>/dev/null \
              | while IFS= read -r -d '' j; do
                  if [ ! -s "$j" ] || [ "$(head -c 2 "$j" 2>/dev/null)" != "PK" ]; then
                    printf '%s\n' "$j"
                  fi
                done
          }

          # Deriva las coordenadas del layout del repo local:
          #   <grupo/con/barras>/<artifactId>/<version>/<artifactId>-<version>.jar
          reparar() {
            local reparados=0 jar rel dir ver art grp
            while IFS= read -r jar; do
              [ -n "$jar" ] || continue
              rel="${jar#$REPO_LOCAL/}"
              dir=$(dirname "$rel")
              ver=$(basename "$dir")
              art=$(basename "$(dirname "$dir")")
              grp=$(dirname "$(dirname "$dir")" | tr '/' '.')
              echo "    $grp:$art:$ver" >&2
              rm -f "$jar"
              mvn -B -q dependency:get -Dartifact="$grp:$art:$ver" \
                -DremoteRepositories="$CENTRAL" >&2 || true
              reparados=$((reparados + 1))
            done < <(jars_invalidos)
            echo "$reparados"
          }

          for intento in 1 2 3; do
            echo "== intento $intento"
            if mvn -B clean install -Pproduction -am -pl owlcms \
                 -Drevision=${{ env.BASE_REVISION }} -Dmaven.test.skip; then
              echo "Build ok en el intento $intento."
              exit 0
            fi

            malos=$(jars_invalidos | wc -l | tr -d ' ')
            if [ "$malos" -eq 0 ]; then
              echo "" >&2
              echo "El build fallo y no hay jars invalidos en el repo local." >&2
              echo "La causa es otra: revisar los [ERROR] de Maven de arriba." >&2
              exit 1
            fi

            echo "  $malos jar(s) invalidos; recuperandolos de central:"
            n=$(reparar)
            echo "  reparados: $n"
          done

          echo "El build siguio fallando despues de 3 intentos." >&2
          exit 1

      - name: Rename the zip
        run: |
          set -euo pipefail
          mv owlcms/target/owlcms*.zip "owlcms/target/owlcms_${TAG}.zip"
          ls -l "owlcms/target/owlcms_${TAG}.zip"

      # Antes de verificar, para que el zip quede descargable desde la pagina del run
      # aunque la verificacion falle.
      - name: Upload the zip as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: owlcms_${{ env.TAG }}
          path: owlcms/target/owlcms_${{ env.TAG }}.zip
          if-no-files-found: error

      # Que el tema realmente entro al artefacto. Sin esto un release puede salir
      # "verde" y no traer ni el tema ni la fuente.
      #   - `local/css/modern*`: el assembly (owlcms/src/main/assembly/zip.xml) copia
      #     `shared/src/main/resources/css` a `local`, asi que los temas viajan solos.
      #   - `@font-face` de Archivo dentro del jar: las hojas de tema se cargan en el
      #     shadow root de los componentes Lit y ahi un @font-face no registra la
      #     familia, por eso vive en META-INF/resources/styles.css, que es
      #     document-scope. No se puede pisar desde `local/`: probado, /local/styles.css
      #     da 500 y un styles.css en el cwd del servidor no se sirve.
      #   - los .woff2 en el classpath del jar: el assembly NO los copia a
      #     `local/fonts/`, pero el resolvedor de `/local/*` cae al classpath.
      - name: Verify the modern theme is in the artifact
        run: |
          set -euo pipefail
          ZIP="owlcms/target/owlcms_${TAG}.zip"
          echo "zip: $ZIP"
          test -s "$ZIP"

          fallo=0

          for tema in modern modern-public modern-video; do
            n=$(unzip -Z1 "$ZIP" "local/css/$tema/*" 2>/dev/null | wc -l | tr -d ' ')
            echo "  local/css/$tema: $n archivos"
            if [ "$n" -lt 15 ]; then
              echo "ERROR: local/css/$tema trae $n archivos, se esperaban 16 o mas." >&2
              fallo=1
            fi
          done

          unzip -p "$ZIP" owlcms.jar > "$RUNNER_TEMP/owlcms.jar"

          # Ojo al portar: el build de produccion de Vaadin MINIFICA styles.css y lo
          # deja en una sola linea. Contar lineas con `grep -c` da 1 aunque el
          # contenido este completo (en el repo, sin minificar, da 4). Se chequea
          # contenido, no lineas.
          CSS=$(unzip -p "$RUNNER_TEMP/owlcms.jar" META-INF/resources/styles.css)

          if grep -q '@font-face' <<< "$CSS"; then
            echo "  @font-face en styles.css: ok"
          else
            echo "ERROR: styles.css no tiene ningun @font-face." >&2
            fallo=1
          fi

          for u in Archivo-Variable-latin.woff2 Archivo-Variable-latin-ext.woff2; do
            if grep -q "$u" <<< "$CSS"; then
              echo "  styles.css referencia $u: ok"
            else
              echo "ERROR: styles.css no referencia $u. La tipografia va a caer a Helvetica." >&2
              fallo=1
            fi
          done

          n=$(grep -o 'Archivo' <<< "$CSS" | wc -l | tr -d ' ' || true)
          echo "  ocurrencias de 'Archivo' en styles.css: $n (se esperan 4 o mas)"
          if [ "${n:-0}" -lt 4 ]; then
            echo "ERROR: styles.css tiene $n ocurrencias de 'Archivo', se esperaban 4." >&2
            grep -o '@font-face[^}]*}' <<< "$CSS" | head -4 >&2 || true
            fallo=1
          fi

          for f in Archivo-Variable-latin.woff2 Archivo-Variable-latin-ext.woff2; do
            if unzip -Z1 "$RUNNER_TEMP/owlcms.jar" "fonts/$f" >/dev/null 2>&1; then
              echo "  fonts/$f: ok"
            else
              echo "ERROR: falta fonts/$f en el jar." >&2
              fallo=1
            fi
          done

          if [ "$fallo" -ne 0 ]; then
            echo "El artefacto no quedo completo. No se publica." >&2
            exit 1
          fi
          echo "Artefacto completo."

      - name: Replace the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="owlcms/target/owlcms_${TAG}.zip"
          REPO="${{ github.repository }}"

          NOTAS="owlcms con la familia de temas \`modern\` (modern / modern-public / modern-video).

          Build no oficial, hecho desde este fork. Los releases oficiales de owlcms estan en
          https://github.com/owlcms/owlcms4/releases

          Para usarlo: descomprimir y correr \`owlcms.jar\`. El tema se elige en Settings
          escribiendo \`css/modern\` (o \`css/modern-public\` / \`css/modern-video\`).
          Para volver al tema de fabrica, \`css/nogrid\`.

          Commit: ${{ github.sha }}"

          # Borrar el release junto con su tag y recrearlo: es la unica forma de que el
          # tag apunte al commit nuevo. El `|| true` cubre la primera corrida, cuando
          # todavia no existe nada que borrar.
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true

          gh release create "$TAG" \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "Ultimo build de main" \
            --prerelease \
            --notes "$NOTAS" \
            "$ZIP"

          echo "Release rodante actualizado: https://github.com/$REPO/releases/tag/$TAG"
