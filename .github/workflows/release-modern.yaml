name: owlcms modern theme release

# Publica un release en ESTE fork con el tema `modern` incluido.
#
# Diferencias con `release.yaml` (el workflow original, que NO sirve en un fork):
#   - El original publica en la organizacion `owlcms`
#     (`gh release create --repo owlcms/owlcms4...`, y hace `git push origin master --force`
#     sobre el repo de distribucion) usando `secrets.OWLCMS_ORG_TOKEN`. En un fork ese
#     secret no existe: falla en `gh auth status`.
#   - Aca se publica en `${{ github.repository }}` con el token automatico del workflow,
#     asi que no hay que configurar ningun secret.
#   - Se eliminaron los pasos de Docker (`secrets.DOCKER_*`) y los de documentacion.
#
# Los pasos de build son los mismos que los del original, a proposito: si algun dia el
# upstream cambia la version de Java o de Maven, hay que portar ese cambio aca tambien.
#
# Como se corre: pestania Actions -> este workflow -> Run workflow -> elegir la rama
# `modern-theme` y poner la revision.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Version del release. Dejar el sufijo -modern para no confundirlo con un release oficial de owlcms.'
        required: true
        default: '68.0.0-beta10-modern'
      prerelease:
        description: 'Marcar el release como prerelease'
        required: false
        type: boolean
        default: true

env:
  MAVEN_OPTS: '-Xmx2048m'

# Necesario para que `gh release create` pueda escribir con github.token.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REVISION: ${{ github.event.inputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      # Guarda temprana: el workflow tiene que estar en la rama default (dev68) para que
      # GitHub muestre el boton "Run workflow", pero la definicion se toma de la rama que
      # se elige al correrlo. Es facil dispararlo sobre dev68 por descuido, y ahi el tema
      # no existe. Sin este chequeo eso se descubre 20 minutos despues, al final del build.
      - name: Check that this branch has the modern theme
        run: |
          set -euo pipefail
          falta=0
          for tema in modern modern-public modern-video; do
            d="shared/src/main/resources/css/$tema"
            if [ -d "$d" ]; then
              echo "  $d: $(ls "$d" | wc -l | tr -d ' ') archivos"
            else
              echo "ERROR: falta $d" >&2
              falta=1
            fi
          done
          if ! grep -q 'Archivo' owlcms/src/main/resources/META-INF/resources/styles.css 2>/dev/null; then
            echo "ERROR: styles.css no trae los @font-face de Archivo." >&2
            falta=1
          fi
          if [ "$falta" -ne 0 ]; then
            echo "" >&2
            echo "La rama '$GITHUB_REF_NAME' no tiene el tema modern." >&2
            echo "Volve a correr el workflow eligiendo la rama 'modern-theme'." >&2
            exit 1
          fi
          echo "Rama '$GITHUB_REF_NAME': el tema esta presente."

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install pinned Maven 3.8.8
        run: |
          set -euo pipefail
          MAVEN_VERSION=3.8.8
          MAVEN_DIR="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION"
          MAVEN_TGZ="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"

          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz" -o "$MAVEN_TGZ"
          rm -rf "$MAVEN_DIR"
          mkdir -p "$MAVEN_DIR"
          tar -xzf "$MAVEN_TGZ" -C "$RUNNER_TEMP"

          echo "$MAVEN_DIR/bin" >> "$GITHUB_PATH"
          echo "M2_HOME=$MAVEN_DIR" >> "$GITHUB_ENV"
          echo "MAVEN_HOME=$MAVEN_DIR" >> "$GITHUB_ENV"
          "$MAVEN_DIR/bin/mvn" -v

      - name: Verify Java and Maven (fail fast)
        run: |
          set -euo pipefail
          if ! command -v java >/dev/null 2>&1; then
            echo "ERROR: java no esta en el runner." >&2
            exit 1
          fi
          if ! command -v mvn >/dev/null 2>&1; then
            echo "ERROR: mvn no esta en el PATH." >&2
            exit 1
          fi
          java -version 2>&1 | sed -n '1p'
          mvn -v
          if ! java -version 2>&1 | grep -qE '"25|openjdk 25|Temurin.*25|jdk-25'; then
            echo "ERROR: se necesita Java 25. Salida real:" >&2
            java -version 2>&1 | sed -n '1,5p' >&2 || true
            exit 1
          fi
          JAVA_BIN_PATH=$(readlink -f "$(which java)") || true
          if [ -n "$JAVA_BIN_PATH" ]; then
            JAVA_HOME=$(dirname $(dirname "$JAVA_BIN_PATH"))
            echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
            echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
          fi

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml', 'shared/pom.xml', 'owlcms/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('pom.xml', 'shared/pom.xml', 'owlcms/pom.xml') }}
            ${{ runner.os }}-maven-

      # El pom declara `owlcms-maven-repo` (https://maven.jflamy.dev/releases) ANTES que
      # central. Ese repo no tiene `vaadin-dev-server`: responde 404 con un cuerpo HTML.
      # Maven lo registro como "Downloaded ... (0 B at 0 B/s)", dejo un jar de 0 bytes en
      # ~/.m2 y no cayo a central, que si lo tiene (229 kB). Despues javac no pudo leer el
      # jar y reporto "cannot access app.owlcms.*" en 40 archivos, tapando la causa real.
      #
      # Sembrarlo desde central antes del build hace que Maven lo resuelva del repo local
      # y no consulte los remotos. Si algun dia el upstream arregla su repo, este paso
      # sigue funcionando (central tiene el artefacto igual), asi que se puede dejar.
      #
      # El barrido de jars vacios es la red general: cualquier otro artefacto que llegue
      # en 0 bytes por el mismo camino se borra antes de compilar.
      - name: Work around empty artifacts from owlcms-maven-repo
        run: |
          set -euo pipefail
          find ~/.m2/repository -name '*.jar' -size 0 -print -delete 2>/dev/null || true
          find ~/.m2/repository -name '*.lastUpdated' -delete 2>/dev/null || true

          ART_JAR="$HOME/.m2/repository/com/vaadin/vaadin-dev-server/25.2.4/vaadin-dev-server-25.2.4.jar"
          mvn -B dependency:get \
            -Dartifact=com.vaadin:vaadin-dev-server:25.2.4 \
            -DremoteRepositories='central::::https://repo.maven.apache.org/maven2'

          if [ ! -s "$ART_JAR" ]; then
            echo "ERROR: vaadin-dev-server sigue vacio o ausente en $ART_JAR" >&2
            echo "Revisar si cambio la version del artefacto en el pom." >&2
            exit 1
          fi
          echo "vaadin-dev-server sembrado desde central: $(wc -c < "$ART_JAR") bytes"

      - name: Build
        run: mvn -B clean install -Pproduction -am -pl owlcms -Drevision=${{ env.REVISION }} -Dmaven.test.skip

      # Chequeo de que el tema realmente entro al artefacto. Sin esto, un release puede
      # salir "verde" y no traer ni el tema ni la fuente.
      #
      # Que se verifica y por que:
      #   - `local/css/modern*` en el zip: el assembly (owlcms/src/main/assembly/zip.xml)
      #     copia `shared/src/main/resources/css` a `local`, asi que los temas viajan solos.
      #   - `@font-face` de Archivo dentro del jar: las hojas de tema se cargan en el shadow
      #     root de los componentes Lit y ahi un @font-face no registra la familia, por eso
      #     vive en META-INF/resources/styles.css, que es document-scope. No se puede pisar
      #     desde `local/`: probado, `/local/styles.css` da 500 y un styles.css en el cwd del
      #     servidor no se sirve.
      #   - los .woff2 en el classpath del jar: el assembly NO los copia a `local/fonts/`,
      #     pero el resolvedor de `/local/*` cae al classpath, asi que se sirven igual.
      - name: Verify the modern theme is in the artifact
        run: |
          set -euo pipefail
          ZIP=$(ls owlcms/target/owlcms*.zip)
          echo "zip: $ZIP"

          fallo=0

          for tema in modern modern-public modern-video; do
            n=$(unzip -Z1 "$ZIP" "local/css/$tema/*" 2>/dev/null | wc -l | tr -d ' ')
            echo "  local/css/$tema: $n archivos"
            if [ "$n" -lt 15 ]; then
              echo "ERROR: local/css/$tema trae $n archivos, se esperaban 16 o mas." >&2
              fallo=1
            fi
          done

          unzip -p "$ZIP" owlcms.jar > "$RUNNER_TEMP/owlcms.jar"

          n=$(unzip -p "$RUNNER_TEMP/owlcms.jar" META-INF/resources/styles.css | grep -c "Archivo" || true)
          echo "  @font-face de Archivo en styles.css: $n coincidencias"
          if [ "$n" -lt 2 ]; then
            echo "ERROR: styles.css no trae los @font-face de Archivo. La tipografia va a caer a Helvetica." >&2
            fallo=1
          fi

          for f in Archivo-Variable-latin.woff2 Archivo-Variable-latin-ext.woff2; do
            if unzip -Z1 "$RUNNER_TEMP/owlcms.jar" "fonts/$f" >/dev/null 2>&1; then
              echo "  fonts/$f: ok"
            else
              echo "ERROR: falta fonts/$f en el jar." >&2
              fallo=1
            fi
          done

          if [ "$fallo" -ne 0 ]; then
            echo "El artefacto no quedo completo. No se publica." >&2
            exit 1
          fi
          echo "Artefacto completo."

      - name: Rename the zip
        run: |
          set -euo pipefail
          mv owlcms/target/owlcms*.zip "owlcms/target/owlcms_${{ env.REVISION }}.zip"
          ls -l owlcms/target/owlcms_${{ env.REVISION }}.zip

      # Red de seguridad: si el paso de release falla (permisos, tag repetido), el zip
      # queda igual descargable desde la pagina del run por 90 dias.
      - name: Upload the zip as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: owlcms_${{ env.REVISION }}
          path: owlcms/target/owlcms_${{ env.REVISION }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ env.REVISION }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.REVISION }}" \
            --target "${{ github.sha }}" \
            ${{ github.event.inputs.prerelease == 'true' && '--prerelease' || '' }} \
            --notes "owlcms con la familia de temas \`modern\` (modern / modern-public / modern-video).

          Build no oficial, hecho desde este fork. Los releases oficiales de owlcms estan en
          https://github.com/owlcms/owlcms4/releases

          Para usarlo: descomprimir y correr \`owlcms.jar\`. El tema se elige en Settings
          escribiendo \`css/modern\` (o \`css/modern-public\` / \`css/modern-video\`).
          Para volver al tema de fabrica, \`css/nogrid\`." \
            "owlcms/target/owlcms_${{ env.REVISION }}.zip"
