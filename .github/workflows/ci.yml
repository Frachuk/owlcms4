name: CI

# PRs only — los pushes a main sacan sus tests del job `test` del pipeline de CD
# (una corrida por push, no dos).
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
